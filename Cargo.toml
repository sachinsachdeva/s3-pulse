[workspace]
members = ["crates/s3pulse-core", "crates/s3pulse-cli"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/sachinsachdeva/s3-pulse"
rust-version = "1.94.1"

[workspace.dependencies]
async-trait = "0.1"
aws-config = "1"
# The default feature set includes "rustls", which is the legacy alias for
# aws-smithy-http-client/legacy-rustls-ring and drags in rustls 0.21 and
# hyper-rustls 0.24 alongside the modern stack. That old path carries
# RUSTSEC-2026-0098. "default-https-client" is the current TLS client, so the
# defaults are listed explicitly with the legacy alias omitted.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
