name: Release

# Builds one VSIX per platform. VS Code resolves platform-specific extensions at
# install time, so each artifact bundles exactly one native backend.
#
# Every target is built on a runner of its own architecture rather than with a
# cross toolchain, because the backend depends on aws-lc-sys — a C library whose
# cross-compilation is fiddly — and because a native build is the only one that
# can be smoke-tested on the runner that produced it.
#
# All six platforms VS Code supports are built. ARM64 Linux and Windows runners
# are free for public repositories, which this is; they would need a paid plan
# on a private one.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      targets:
        description: 'Targets to build (JSON array). A single target is a cheap way to validate the pipeline.'
        type: string
        default: '["darwin-arm64","darwin-x64","linux-arm64","linux-x64","win32-arm64","win32-x64"]'
      release:
        description: 'Attach the VSIXes to a GitHub release'
        type: boolean
        default: false
      publish:
        description: 'Publish to the VS Code Marketplace (requires the VSCE_PAT secret)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  # A tag build always covers every platform; a manual run builds what was asked
  # for, so a cheap single-target run can validate the pipeline.
  ALL_TARGETS: '["darwin-arm64","darwin-x64","linux-arm64","linux-x64","win32-arm64","win32-x64"]'

jobs:
  plan:
    name: plan
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - id: plan
        env:
          REQUESTED: ${{ inputs.targets }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const RUNNERS = {
            'darwin-arm64': { runner: 'macos-15',       triple: 'aarch64-apple-darwin' },
            'darwin-x64':   { runner: 'macos-15-intel', triple: 'x86_64-apple-darwin' },
            'linux-x64':    { runner: 'ubuntu-22.04', triple: 'x86_64-unknown-linux-gnu' },
            'linux-arm64':  { runner: 'ubuntu-22.04-arm', triple: 'aarch64-unknown-linux-gnu' },
            'win32-x64':    { runner: 'windows-2022', triple: 'x86_64-pc-windows-msvc' },
            'win32-arm64':  { runner: 'windows-11-arm', triple: 'aarch64-pc-windows-msvc' }
          };
          const all = JSON.parse(process.env.ALL_TARGETS);
          const requested = process.env.REQUESTED ? JSON.parse(process.env.REQUESTED) : all;
          const unknown = requested.filter((t) => !RUNNERS[t]);
          if (unknown.length) {
            console.error(`Unknown target(s): ${unknown.join(', ')}`);
            process.exit(1);
          }
          const include = requested.map((target) => ({ target, ...RUNNERS[target] }));
          console.log(`matrix=${JSON.stringify({ include })}`);
          console.log(`targets=${JSON.stringify(requested)}`);
          NODE

  # Run the definition-of-done once rather than once per packaged target, which
  # is what invoking `npm run package` in every matrix leg would do.
  verify:
    name: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: npm ci
        working-directory: extension
      - run: npm run check
        working-directory: extension
      - run: npm test
        working-directory: extension

  backend:
    name: backend ${{ matrix.target }}
    needs: [plan, verify]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # aws-lc-sys compiles C and, on x86_64 Windows, assembles with NASM. The
      # other images already carry a usable toolchain.
      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install --no-progress -y nasm
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build backend
        run: cargo build --release -p s3pulse-cli --target ${{ matrix.triple }}

      # Proves the artifact actually executes on the platform it targets, which
      # a cross-compiled build could not demonstrate.
      - name: Verify the binary runs
        shell: bash
        run: |
          BIN="target/${{ matrix.triple }}/release/s3pulse"
          [ "${{ runner.os }}" = "Windows" ] && BIN="$BIN.exe"
          "$BIN" --version

      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.target }}
          path: target/${{ matrix.triple }}/release/s3pulse${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 7

  package:
    name: package ${{ matrix.target }}
    needs: [plan, backend]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci
        working-directory: extension

      - uses: actions/download-artifact@v4
        with:
          name: backend-${{ matrix.target }}
          path: staging

      # Exactly one backend is staged, so a VSIX can never pick up another
      # platform's binary.
      - name: Stage the backend
        run: node extension/scripts/stage-backend.mjs --release --target ${{ matrix.target }} --from "$GITHUB_WORKSPACE/staging"

      - name: Compile
        run: npm run compile
        working-directory: extension

      # package.mjs rather than `npm run package`: the wrapper re-runs the whole
      # check/test suite, which the verify job has already done once.
      - name: Package
        run: node ./scripts/package.mjs --target ${{ matrix.target }}
        working-directory: extension

      - name: Confirm the VSIX carries the right backend
        run: |
          VSIX=$(ls extension/*.vsix)
          EXPECTED="extension/bin/${{ matrix.target }}/s3pulse"
          case "${{ matrix.target }}" in win32-*) EXPECTED="$EXPECTED.exe" ;; esac
          unzip -l "$VSIX" | grep -F "$EXPECTED" || { echo "::error::$VSIX is missing $EXPECTED"; exit 1; }
          # A VSIX holding more than one backend would ship every platform's binary.
          COUNT=$(unzip -l "$VSIX" | grep -cE 'extension/bin/.*/s3pulse(\.exe)?$')
          [ "$COUNT" = "1" ] || { echo "::error::$VSIX bundles $COUNT backends, expected 1"; exit 1; }
          echo "$VSIX carries exactly one backend for ${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: extension/*.vsix
          if-no-files-found: error

  release:
    name: release
    needs: [plan, package]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: artifacts
          merge-multiple: true
      - name: Attach the VSIXes to a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
        run: |
          ls -l artifacts
          gh release create "$TAG" artifacts/*.vsix \
            --title "$TAG" \
            --notes "Built from ${{ github.sha }}. Targets: ${{ needs.plan.outputs.targets }}" \
            --draft

  publish:
    name: publish to the Marketplace
    needs: [plan, package]
    # Never publishes by accident: a tag alone is not enough, the run has to ask
    # for it, and the job no-ops without a token.
    if: inputs.publish
    runs-on: ubuntu-22.04
    environment: marketplace
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci
        working-directory: extension

      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: artifacts
          merge-multiple: true

      - name: Check the token is present
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT is not set. Create an Azure DevOps token with Marketplace > Manage scope and add it as a repository secret."
            exit 1
          fi

      # Every platform build must be present. Publishing a subset would leave
      # the Marketplace offering this version to some platforms and not others.
      - name: Require a VSIX for every target
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: |
          node -e '
            const fs = require("fs");
            const targets = JSON.parse(process.env.TARGETS);
            const files = fs.readdirSync("artifacts").filter((f) => f.endsWith(".vsix"));
            const missing = targets.filter((t) => !files.some((f) => f.includes(t)));
            if (missing.length) {
              console.error(`::error::No VSIX for: ${missing.join(", ")}`);
              process.exit(1);
            }
            console.log(`${files.length} VSIX files for ${targets.length} targets`);
          '

      # One package per invocation, retried, rather than one invocation with all
      # six. The Marketplace throttles consecutive publishes: it accepts about
      # two quickly and then hangs the next until a 180s timeout. A single
      # invocation abandons every remaining package at that point, which leaves
      # the Marketplace offering the new version to some platforms and the old
      # one to the rest — exactly what the check above exists to prevent, just
      # arrived at from the other side.
      #
      # Publishing one at a time also makes a re-run safe: a target already at
      # this version is reported as such by vsce and treated as done, so a
      # partial run is finished simply by running it again.
      - name: Publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        working-directory: extension
        run: |
          set -uo pipefail
          shopt -s nullglob
          packages=("$GITHUB_WORKSPACE"/artifacts/*.vsix)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No VSIX files to publish"
            exit 1
          fi

          published=()
          failed=()
          last=$(( ${#packages[@]} - 1 ))

          for index in "${!packages[@]}"; do
            package="${packages[$index]}"
            name=$(basename "$package")
            done_with_it=false

            for attempt in 1 2 3; do
              echo "::group::Publishing $name (attempt $attempt)"
              if output=$(npx --no-install vsce publish --packagePath "$package" 2>&1); then
                echo "$output"
                echo "::endgroup::"
                done_with_it=true
                break
              fi
              echo "$output"
              echo "::endgroup::"

              # Re-running after a partial failure re-offers packages that
              # already landed. That is success, not an error.
              if grep -qiE 'already exists|already published' <<<"$output"; then
                echo "$name is already published at this version"
                done_with_it=true
                break
              fi

              if [ "$attempt" -lt 3 ]; then
                backoff=$((attempt * 60))
                echo "Retrying $name in ${backoff}s"
                sleep "$backoff"
              fi
            done

            if [ "$done_with_it" = true ]; then
              published+=("$name")
            else
              failed+=("$name")
            fi

            # Space the publishes out; back to back is what draws the throttle.
            if [ "$index" -lt "$last" ]; then
              sleep 20
            fi
          done

          echo "Published ${#published[@]} of ${#packages[@]}: ${published[*]:-none}"

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Not published: ${failed[*]}. The Marketplace is now serving this version to some platforms and the previous one to the rest. Re-run this workflow with the same inputs; packages that already landed are skipped."
            exit 1
          fi
